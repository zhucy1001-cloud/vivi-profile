                                    <div class="gold-border p-4 rounded-2xl text-center bg-[#080c14]">
                                        <div class="text-2xl font-bold gold-text">${m.val}</div>
                                        <div class="text-xs text-gray-400 mt-1">${m.label}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="md:col-span-5 flex justify-center">
                            <div class="w-full max-w-[280px] h-[380px] sm:h-[420px] rounded-2xl overflow-hidden gold-border bg-[#080c14] p-2">
                                <img src="${CONFIG.profile.avatarImage}" alt="${CONFIG.profile.name} 照片" class="w-full h-full object-cover rounded-xl object-top">
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-6 border-t border-gray-800">
                        ${CONFIG.profile.features.map(f => `
                            <div class="gold-border p-5 rounded-2xl bg-[#080c14] space-y-2">
                                <h4 class="font-bold text-white text-sm gold-text">${f.title}</h4>
                                <p class="text-xs text-gray-300 leading-relaxed">${f.desc}</p>
                            </div>
                        `).join('')}
                    </div>
                </section>
            </div>

            <!-- 第 3 页：特长与承诺 -->
            <div class="print-page-center">
                <div class="w-full flex flex-col space-y-16 print:space-y-0 print:gap-10">
                    <section class="print-section gold-border rounded-3xl p-8 sm:p-12 bg-[#0d1527] shadow-2xl space-y-10 print:p-6 print:space-y-4">
                        <div class="text-center space-y-1">
                            <h2 class="text-2xl sm:text-3xl font-bold text-white tracking-wide print:text-xl">多元演艺特长</h2>
                            <p class="text-xs gold-text tracking-[0.2em] uppercase print:text-[10px]">VERSATILE TALENTS & PERFORMANCE</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 print:grid-cols-1 print:gap-3 print:w-[90%] print:mx-auto">
                            ${CONFIG.talents.map(t => `
                                <div class="gold-border p-6 rounded-2xl bg-[#080c14] space-y-3 print:p-4 print:space-y-1">
                                    <h3 class="font-bold gold-text text-base print:text-sm">${t.title}</h3>
                                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">${t.en}</p>
                                    <p class="text-xs text-gray-300 leading-relaxed">${t.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                    <section class="print-section gold-border rounded-3xl p-6 sm:p-8 bg-[#0d1527] shadow-xl space-y-6 mt-16 print:mt-6 print:p-6 print:space-y-4">
                        <div class="text-center space-y-1">
                            <h3 class="text-lg sm:text-xl font-bold text-white tracking-wide print:text-xl">核心优势与服务承诺</h3>
                            <p class="text-[10px] gold-text tracking-[0.2em] uppercase print:text-[10px]">CORE ADVANTAGES & COMMITMENT</p>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 print:grid-cols-1 print:gap-3 print:w-[90%] print:mx-auto">
                            ${CONFIG.advantages.map(a => `
                                <div class="gold-border p-5 sm:p-6 rounded-2xl bg-[#080c14] space-y-2 print:p-4 print:space-y-1">
                                    <h4 class="font-bold text-white text-sm gold-text">${a.title}</h4>
                                    <p class="text-xs sm:text-sm text-gray-400 leading-relaxed print:text-xs">${a.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                </div>
            </div>

            <!-- 第 4 页及以后：活动实况案例集 -->
            <div class="text-center space-y-1 pt-4 print:hidden">
                <h2 class="text-2xl sm:text-3xl font-bold text-white tracking-wide">活动实况案例</h2>
                <p class="text-xs gold-text tracking-[0.2em] uppercase">STAGE GALLERY & SCENARIOS</p>
            </div>
            ${casesHtml}

            <!-- 最后一页：联系方式与尾页 -->
            <div class="print-page-center print-page-last">
                <section class="print-section gold-border rounded-3xl p-8 sm:p-12 bg-gradient-to-b from-[#0d1527] via-[#101b31] to-[#14223d] shadow-2xl text-center space-y-6 relative overflow-hidden print:p-12">
                    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-500/10 via-transparent to-transparent pointer-events-none"></div>
                    <h2 class="text-2xl sm:text-3xl font-bold text-white tracking-wide relative z-10">${CONFIG.footer.title}</h2>
                    <p class="text-sm sm:text-base text-gray-300 max-w-2xl mx-auto leading-relaxed relative z-10">${CONFIG.footer.desc}</p>
                    <div class="pt-6 border-t border-amber-500/20 max-w-2xl mx-auto grid grid-cols-1 md:grid-cols-2 print:flex print:flex-col print:items-center print:gap-10 items-center text-left relative z-10 print:pt-10 print:w-full">
                        <div class="md:border-r md:border-amber-500/20 md:pr-8 py-2 space-y-4 text-center md:text-left print:border-none print:pr-0 print:py-0 print:w-full print:flex print:flex-col print:items-center print:gap-10 print:space-y-0">
                            <div class="print:flex print:flex-col print:items-center">
                                <div class="text-xs text-gray-400 font-medium mb-1 print:mb-2 print:text-sm">主持人</div>
                                <div class="text-white font-semibold text-sm print:text-lg">${CONFIG.profile.name} <span class="text-gray-300 font-normal print:text-gray-400">${CONFIG.contact.role || '(资深商务司仪)'}</span></div>
                            </div>
                            <div class="print:flex print:flex-col print:items-center">
                                <div class="text-xs text-gray-400 font-medium mb-0.5 print:mb-2 print:text-sm">个人主页</div>
                                <a href="${CONFIG.contact.websiteUrl}" target="_blank" class="gold-text font-semibold hover:underline text-sm inline-block print:text-lg">${CONFIG.contact.websiteText}</a>
                            </div>
                        </div>
                        <div class="space-y-4 text-center md:text-left md:pl-2 print:pl-0 print:w-full print:flex print:flex-col print:items-center print:gap-10 print:space-y-0">
                            <div class="print:flex print:flex-col print:items-center">
                                <div class="text-xs text-gray-400 font-medium print:mb-2 print:text-sm">电话 / 微信</div>
                                <a href="tel:${CONFIG.contact.phone}" class="gold-text font-semibold hover:underline text-sm inline-block mt-0.5 print:mt-0 print:text-lg">${CONFIG.contact.phone} <span class="text-[10px] text-gray-400 font-normal print:hidden">(点击拨打电话)</span></a>
                            </div>
                            <div class="print:flex print:flex-col print:items-center">
                                <div class="text-xs text-gray-400 font-medium print:mb-2 print:text-sm">电子邮箱</div>
                                <a href="mailto:${CONFIG.contact.email}" class="gold-text font-semibold hover:underline text-sm inline-block mt-0.5 break-all print:mt-0 print:text-lg">${CONFIG.contact.email} <span class="text-[10px] text-gray-400 font-normal print:hidden">(点击发送邮件)</span></a>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        `;
    </script>

</body>
</html>
